
name: Mezitli Ilan Takip

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  ilan-takip:
    runs-on: ubuntu-latest

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gereksinimleri yukle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Telegram botunu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
