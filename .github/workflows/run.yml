
name: Mezitli Emlak Takip Botu

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: mezitli-emlak-takip
  cancel-in-progress: false

jobs:
  ilan-takip:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python paketlerini yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Önceki ilan kayıtlarını yükle
        uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: mezitli-seen-${{ github.run_id }}
          restore-keys: |
            mezitli-seen-

      - name: Botu çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: İlan kayıtlarını sakla
        if: always() && hashFiles('seen.json') != ''
        uses: actions/cache/save@v4
        with:
          path: seen.json
          key: mezitli-seen-${{ github.run_id }}

      - name: Kayıtları depoya yaz
        if: success() && hashFiles('seen.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen listings"
          git push
